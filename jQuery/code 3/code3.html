<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive FAQ</title>
    <link rel="stylesheet" href="code3.css">
</head>
<body>

<h2>FAQ Section</h2>

<div class="faq">
    <div class="question" tabindex="0">What is your return policy?</div>
    <div class="answer">
        <p>You can return products within 30 days.</p>
        <input type="text" placeholder="Write your feedback">
    </div>
</div>

<div class="faq">
    <div class="question" tabindex="0">Do you offer free shipping?</div>
    <div class="answer">
        <p>Yes, on orders above ₹500.</p>
        <input type="text" placeholder="Write your feedback">
    </div>
</div>

<div class="faq">
    <div class="question" tabindex="0">How can I contact support?</div>
    <div class="answer">
        <p>You can email us at support@example.com</p>
        <input type="text" placeholder="Write your feedback">
    </div>
</div>

<script src="code3.js"></script>
</body>
</html>
