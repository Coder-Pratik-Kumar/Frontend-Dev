<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer Banner</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .banner {
            background: orange;
            color: white;
            padding: 15px;
            margin-bottom: 10px;
            width: 300px;
            display: block;
            font-size: 18px;
            border-radius: 4px;
            text-align: center;
        }

        button {
            margin-right: 5px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

<h2>Special Offer Banners</h2>

<div class="banner" id="b1"> 50% OFF on all Electronics</div>
<div class="banner" id="b2"> Buy 1 Get 1 Free</div>
<div class="banner" id="b3"> Free Delivery Today</div>

<button id="hideBtn">Hide</button>
<button id="showBtn">Show</button>
<button id="slideBtn">Slide Up/Down</button>
<button id="fadeBtn">Fade In/Out</button>

<script src="code4.js"></script>

</body>
</html>
