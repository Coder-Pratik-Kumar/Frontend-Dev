<!DOCTYPE html>
<html>
<head>
    <title>Multi jQuery Widgets</title>

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body { font-family: Arial; padding: 20px; }

        .carousel {
            width: 300px; height: 150px; background: #ddd;
            border-radius: 5px; display: flex; align-items: center;
            justify-content: center; margin-bottom: 20px;
        }

        .widget {
            padding: 10px; margin: 8px 0; background: #f2f2f2;
            border-radius: 5px; cursor: pointer;
        }

        .active { background: lightblue; border: 2px solid blue; }

        #modal {
            width: 250px; padding: 20px; background: white;
            border: 2px solid black; display: none; margin-top: 20px;
        }

        .tooltip {
            display: none; background: black; color: white;
            padding: 5px; border-radius: 3px; font-size: 12px;
            position: absolute;
        }
    </style>
</head>
<body>

<h2>Multi jQuery Widgets</h2>

<div class="carousel" id="slider">Slide 1</div>

<div class="widget">Widget 1</div>
<div class="widget">Widget 2</div>
<div class="widget">Widget 3</div>

<button id="showModal">Show Notification</button>

<div id="modal">New Notification</div>

<div class="hoverItem" style="margin-top:20px; padding:10px; background:#eee; width:150px;">
    Hover for tooltip
</div>
<div class="tooltip" id="tip">Tooltip text</div>

<script src="code9.js"></script>
</body>
</html>
